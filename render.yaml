# Бесплатный сервер приложения. Аккаунты и данные хранятся в отдельном Neon PostgreSQL.
services:
  - type: web
    name: studyflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STUDYFLOW_POSTGRES_URL
        sync: false
      - key: STUDYFLOW_REQUIRE_POSTGRES
        value: 'true'
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: STUDYFLOW_AI_USER_DAILY_LIMIT
        value: '20'
      - key: STUDYFLOW_AI_GLOBAL_DAILY_LIMIT
        value: '100'
