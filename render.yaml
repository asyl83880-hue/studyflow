# Бесплатное демо. SQLite очищается при перезапуске или новом развёртывании.
services:
  - type: web
    name: studyflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STUDYFLOW_DEMO_ACCESS_CODE
        generateValue: true
      - key: STUDYFLOW_DATABASE_URL
        value: sqlite:////tmp/studyflow.db
