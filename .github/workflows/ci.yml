name: StudyFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studyflow_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          STUDYFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/studyflow_test

  docker:
    needs: [frontend, backend, postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual production image
        run: docker build --tag studyflow:ci .
      - name: Check production startup and API access
        run: |
          docker run --detach --rm --name studyflow-ci --publish 127.0.0.1:8000:8000 --env NEON_AUTH_BASE_URL=https://auth.example.test/auth --env NEON_AUTH_JWKS_URL=https://auth.example.test/auth/jwks studyflow:ci
          timeout 30 bash -c 'until curl --fail --silent http://127.0.0.1:8000/api/health; do sleep 1; done'
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/tasks)" = 401
          curl --fail --silent http://127.0.0.1:8000/api/config
      - name: Show container logs on failure
        if: failure()
        run: docker logs studyflow-ci || true
